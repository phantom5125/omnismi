name: V2 software validation
on:
  pull_request:
  push:
    branches: ["main", "codex/v2-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-and-protocol-tests:
    name: Software / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]' build twine
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify a core-only wheel install and documented quickstarts
        run: |
          python -m venv "$RUNNER_TEMP/omnismi-wheel"
          "$RUNNER_TEMP/omnismi-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/omnismi-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/omnismi-wheel/bin/python" scripts/verify_v2_install.py
          "$RUNNER_TEMP/omnismi-wheel/bin/python" scripts/verify_quickstart.py
      - name: Retain installable preview packages
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: preview-packages
          path: dist/
          retention-days: 14
  documentation:
    name: Documentation and onboarding checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[docs]' ruff
      - run: ruff check scripts/verify_v2_install.py scripts/verify_quickstart.py
      - run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site/
          retention-days: 14

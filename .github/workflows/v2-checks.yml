name: V2 software validation
on:
  pull_request:
  push:
    branches: ["codex/v2-*"]
permissions:
  contents: read
jobs:
  offline-and-protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python scripts/verify_v2_install.py
